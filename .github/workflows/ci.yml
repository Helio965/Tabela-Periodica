name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes (inclui validação dos 118 elementos)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build de produção
        run: npx vite build
